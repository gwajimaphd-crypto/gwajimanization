<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwajimanization Team — Official Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --card-bg: rgba(22, 25, 35, 0.75);
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glass: rgba(212, 175, 55, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; line-height: 1.5; }

        .main-header { position: sticky; top: 0; z-index: 1000; background: rgba(10, 11, 14, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-glass); width: 100%; }
        .nav-container { max-width: 1280px; margin: 0 auto; padding: 15px 24px; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 900; color: var(--gold-primary); text-decoration: none; }
        .brand-logo span { color: var(--text-light); }
        .desktop-nav { display: flex; gap: 18px; align-items: center; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.88rem; font-weight: 600; transition: all 0.3s ease; cursor: pointer; }
        .nav-link:hover, .nav-link.active { color: var(--gold-primary); }

        .mobile-toggle { display: none; background: none; border: none; color: var(--gold-primary); font-size: 1.8rem; cursor: pointer; }
        .mobile-menu { display: none; flex-direction: column; background: #111319; padding: 15px 24px; border-bottom: 1px solid var(--border-glass); }
        .mobile-menu.active { display: flex; }
        .mobile-menu a { color: var(--text-light); text-decoration: none; padding: 12px 0; font-weight: 600; }

        .main-layout { max-width: 1280px; margin: 30px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active-tab { display: block; }
        .glass-card { background: var(--card-bg); border: 1px solid var(--border-glass); backdrop-filter: blur(10px); border-radius: 16px; padding: 24px; margin-bottom: 24px; }
        
        .hero-title { font-family: 'Cinzel', serif; font-size: clamp(1.5rem, 4vw, 2.5rem); margin: 10px 0; background: var(--gold-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .hero-cta-group { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; margin-top: 20px; }
        .btn-action { text-align: center; padding: 12px 10px; border-radius: 8px; font-weight: 700; text-decoration: none; font-size: 0.85rem; border: 1px solid var(--gold-primary); color: var(--gold-primary); }
        .btn-action.gold { background: var(--gold-gradient); color: #000; border: none; }

        .video-responsive { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; }
        .video-responsive iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .cards-grid, .social-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(240px, 1fr)); gap: 20px; margin-top: 20px; }
        .card-cover-box { position: relative; width: 100%; height: 170px; border-radius: 10px; overflow: hidden; margin-bottom: 12px; }
        .card-cover-img { width: 100%; height: 100%; object-fit: cover; }
        .play-overlay { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); background: rgba(0,0,0,0.7); color: var(--gold-primary); width: 45px; height: 45px; border-radius: 50%; display: flex; align-items: center; justify-content: center; text-decoration: none; }
        
        .btn-whatsapp, .btn-tiktok { display: flex; align-items: center; justify-content: center; gap: 10px; padding: 14px; border-radius: 8px; text-decoration: none; font-weight: bold; color: #fff; }
        .btn-whatsapp { background: #25D366; } .btn-tiktok { background: #000; border: 1px solid #333; }
        
        @media (max-width: 850px) { .desktop-nav { display: none; } .mobile-toggle { display: block; } }
        @media (max-width: 480px) { .hero-cta-group { grid-template-columns: 1fr; } }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="nav-container">
            <a href="#" class="brand-logo">GWAJIMANIZATION <span>TEAM</span></a>
            <nav class="desktop-nav">
                <a href="#home" class="nav-link active" data-tab="home">Mwanzo</a>
                <a href="#live" class="nav-link" data-tab="live">LIVE</a>
                <a href="#videos" class="nav-link" data-tab="videos">Masomo</a>
                <a href="#audio" class="nav-link" data-tab="audio">Podcast</a>
                <a href="#blog" class="nav-link" data-tab="blog">Blogspot</a>
                <a href="#sadaka" class="nav-link" data-tab="sadaka">Sadaka</a>
                <a href="#mawasiliano" class="nav-link" data-tab="mawasiliano">Mawasiliano</a>
            </nav>
            <button class="mobile-toggle" id="mobile-toggle-btn">☰</button>
        </div>
        <div class="mobile-menu" id="mobile-dropdown">
            <a href="#home" data-tab="home">Mwanzo</a>
            <a href="#live" data-tab="live">LIVE</a>
            <a href="#videos" data-tab="videos">Masomo</a>
            <a href="#mawasiliano" data-tab="mawasiliano">Mawasiliano</a>
        </div>
    </header>

    <main class="main-layout">
        <section id="home" class="tab-content active-tab">
            <div class="glass-card">
                <h1 class="hero-title">GWAJIMANIZATION TEAM</h1>
                <p class="hero-desc">Huduma ya Askofu Josephat Gwajima.</p>
                <div class="hero-cta-group">
                    <a href="#live" class="btn-action gold" data-tab="live">🔴 TAZAMA LIVE</a>
                    <a href="#videos" class="btn-action" data-tab="videos">🎬 VINJARI VIDEO</a>
                    <a href="#audio" class="btn-action" data-tab="audio">🎧 SIKILIZA PODCAST</a>
                    <a href="#blog" class="btn-action" data-tab="blog">📖 SOMA BLOGU</a>
                </div>
            </div>
        </section>

        <section id="live" class="tab-content">
            <div class="glass-card">
                <div class="video-responsive"><iframe src="https://www.youtube.com/embed/live_stream?channel=UCj8LUerrlq3Hw9mWpt_HJHA" allowfullscreen></iframe></div>
            </div>
        </section>

        <section id="videos" class="tab-content">
            <div class="cards-grid">
                <!-- Video 1-17 logic remains same, grid handles responsiveness -->
                <div class="glass-card">
                    <div class="card-cover-box"><img src="https://img.youtube.com/vi/SPCSjIU2JEA/hqdefault.jpg" class="card-cover-img"><a href="https://youtu.be/SPCSjIU2JEA" target="_blank" class="play-overlay">▶</a></div>
                    <h3 class="card-title">Somo La Ndoa</h3>
                </div>
            </div>
        </section>

        <section id="mawasiliano" class="tab-content">
            <div class="social-grid">
                <a href="https://wa.me/255766405739" class="btn-whatsapp">WhatsApp</a>
                <a href="https://www.tiktok.com/@gwajimanization_" class="btn-tiktok">TikTok</a>
            </div>
        </section>
    </main>

    <script>
        document.querySelectorAll('[data-tab]').forEach(link => {
            link.addEventListener('click', (e) => {
                e.preventDefault();
                document.querySelectorAll('.tab-content').forEach(t => t.classList.remove('active-tab'));
                document.getElementById(link.getAttribute('data-tab')).classList.add('active-tab');
                document.getElementById('mobile-dropdown').classList.remove('active');
            });
        });
        document.getElementById('mobile-toggle-btn').addEventListener('click', () => {
            document.getElementById('mobile-dropdown').classList.toggle('active');
        });
    </script>
</body>
</html>
