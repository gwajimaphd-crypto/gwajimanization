<!DOCTYPE html>
<html lang="sw">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Gwajimanization Team — Official Portal</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Plus+Jakarta+Sans:wght@400;600;700;800&display=swap" rel="stylesheet">
    <style>
        :root {
            --bg-dark: #0a0b0e;
            --card-bg: rgba(22, 25, 35, 0.75);
            --gold-primary: #d4af37;
            --gold-gradient: linear-gradient(135deg, #bf953f 0%, #fcf6ba 25%, #b38728 50%, #fbf5b7 75%, #aa771c 100%);
            --text-light: #f3f4f6;
            --text-muted: #9ca3af;
            --border-glass: rgba(212, 175, 55, 0.25);
        }
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Plus Jakarta Sans', sans-serif; }
        body { background-color: var(--bg-dark); color: var(--text-light); min-height: 100vh; overflow-x: hidden; }
        
        .main-header { position: sticky; top: 0; z-index: 1000; background: rgba(10, 11, 14, 0.95); backdrop-filter: blur(12px); border-bottom: 1px solid var(--border-glass); padding: 15px 24px; }
        .nav-container { max-width: 1280px; margin: 0 auto; display: flex; justify-content: space-between; align-items: center; }
        .brand-logo { font-family: 'Cinzel', serif; font-size: 1.2rem; font-weight: 900; color: var(--gold-primary); text-decoration: none; }
        
        .nav-menu { display: flex; gap: 20px; }
        .nav-link { color: var(--text-muted); text-decoration: none; font-size: 0.9rem; font-weight: 600; cursor: pointer; }
        .nav-link:hover, .nav-link.active { color: var(--gold-primary); }

        .main-layout { max-width: 1280px; margin: 30px auto; padding: 0 20px; }
        .tab-content { display: none; }
        .tab-content.active-tab { display: block; }
        
        .glass-card { background: var(--card-bg); border: 1px solid var(--border-glass); backdrop-filter: blur(10px); border-radius: 16px; padding: 25px; margin-bottom: 25px; }
        .video-responsive { position: relative; padding-bottom: 56.25%; height: 0; overflow: hidden; border-radius: 12px; }
        .video-responsive iframe { position: absolute; top: 0; left: 0; width: 100%; height: 100%; border: none; }
        
        .btn-whatsapp { background: #25D366; color: #fff; padding: 15px; border-radius: 8px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; margin-bottom: 15px; }
        .btn-tiktok { background: #000; color: #fff; padding: 15px; border-radius: 8px; text-decoration: none; display: flex; align-items: center; justify-content: center; gap: 10px; font-weight: bold; border: 1px solid #333; }
        
        @media (max-width: 768px) { .nav-menu { gap: 10px; font-size: 0.75rem; } }
    </style>
</head>
<body>

    <header class="main-header">
        <div class="nav-container">
            <a href="#" class="brand-logo">GWAJIMANIZATION</a>
            <nav class="nav-menu">
                <a class="nav-link active" onclick="showTab('home')">Mwanzo</a>
                <a class="nav-link" onclick="showTab('live')">LIVE</a>
                <a class="nav-link" onclick="showTab('mawasiliano')">Mawasiliano</a>
            </nav>
        </div>
    </header>

    <main class="main-layout">
        <section id="home" class="tab-content active-tab">
            <div class="glass-card">
                <h1>KARIBU GWAJIMANIZATION</h1>
                <p>Pata mafundisho ya Askofu Josephat Gwajima.</p>
            </div>
        </section>

        <section id="live" class="tab-content">
            <div class="glass-card">
                <div class="video-responsive">
                    <iframe src="https://www.youtube.com/embed/live_stream?channel=UCj8LUerrlq3Hw9mWpt_HJHA" allowfullscreen></iframe>
                </div>
            </div>
        </section>

        <section id="mawasiliano" class="tab-content">
            <div class="glass-card">
                <h2>Mawasiliano Yetu</h2>
                <br>
                <a href="https://wa.me/255766405739" class="btn-whatsapp" target="_blank">WhatsApp: 0766 405 739</a>
                <a href="https://www.tiktok.com/@gwajimanization_" class="btn-tiktok" target="_blank">TikTok: @gwajimanization_</a>
            </div>
        </section>
    </main>

    <script>
        function showTab(tabId) {
            document.querySelectorAll('.tab-content').forEach(t => t.style.display = 'none');
            document.querySelectorAll('.nav-link').forEach(l => l.classList.remove('active'));
            document.getElementById(tabId).style.display = 'block';
            event.currentTarget.classList.add('active');
        }
    </script>
</body>
</html>
