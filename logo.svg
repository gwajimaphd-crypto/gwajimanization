<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 120" width="100%" height="100%">
  <defs>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFF2A3" />
      <stop offset="50%" stop-color="#D4AF37" />
      <stop offset="100%" stop-color="#AA7C11" />
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="2" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>
  </defs>

  <g transform="translate(10, 10)">
    <path d="M 35,5 L 65,5 L 75,35 L 35,85 L -5,35 Z" fill="none" stroke="url(#goldGrad)" stroke-width="3" />
    <path d="M 30,20 L 40,20 L 40,30 L 55,30 L 55,38 L 40,38 L 40,70 L 30,70 L 30,38 L 15,38 L 15,30 L 30,30 Z" fill="url(#goldGrad)" filter="url(#glow)" />
  </g>

  <text x="100" y="55" font-family="'Cinzel', 'Georgia', serif" font-size="32" font-weight="900" fill="url(#goldGrad)" letter-spacing="2">
    GWAJIMANIZATION
  </text>
  
  <text x="102" y="80" font-family="'Montserrat', 'Helvetica', sans-serif" font-size="12" font-weight="600" fill="#E2E8F0" letter-spacing="6">
    MINISTRY PORTAL
  </text>
</svg>
